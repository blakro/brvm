[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brvm"
version = "0.2.0"
description = "Collecte, archivage et analyse des cours de la Bourse Régionale des Valeurs Mobilières (UEMOA)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["brvm", "uemoa", "bourse", "finance", "afrique", "streamlit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: French",
]

requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "scikit-learn>=1.3",
]

[project.urls]
Source = "https://github.com/blakro/brvm"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Interface web. Streamlit Community Cloud installe requirements.txt,
# pas cet extra ; il sert à retrouver le même environnement en local.
web = ["streamlit>=1.49", "altair>=5.5"]

[project.scripts]
brvm = "brvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
