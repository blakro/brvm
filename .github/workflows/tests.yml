name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# La suite ne fait que lire le dépôt : rien à écrire, aucun jeton élargi.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer le paquet
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # La suite ne touche pas au réseau : elle travaille sur les captures
      # de tests/donnees. C'est délibéré — les runners GitHub n'atteignent
      # pas toujours brvm.org, et un test qui échoue pour cette raison ne
      # dit rien du code qu'il prétend vérifier.
      - name: Tests
        run: pytest -q

      # Le diagnostic contre un témoin, en plus des tests : il imprime les
      # colonnes reconnues, ce qui rend un échec de sélecteur lisible
      # directement dans le journal de l'action.
      - name: Diagnostic sur la capture de référence
        run: python -m brvm verifier tests/donnees/cote_brvm_20260727_cloture.html
