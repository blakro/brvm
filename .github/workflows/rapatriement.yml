name: rapatrier l'historique

# Déclenchement à la main uniquement. Ce n'est pas une ingestion : c'est un
# rapatriement ponctuel de plusieurs centaines de requêtes vers un site
# tiers, et cela ne s'exécute pas tout seul toutes les nuits.
#
# L'accès sortant étant refusé depuis l'environnement de développement,
# c'est ici — et seulement ici — que le lecteur rencontre la vraie mise en
# page de sikafinance. D'où la sonde : le premier passage se fait sur une
# valeur, sans rien écrire, et son journal dit si les sélecteurs tiennent.
on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Première séance (AAAA-MM-JJ)"
        required: true
        default: "2020-01-01"
      fin:
        description: "Dernière séance (AAAA-MM-JJ)"
        required: true
        default: "2026-07-27"
      sonde:
        description: "Sonder une seule valeur sans rien écrire"
        type: boolean
        default: true
      volume:
        description: "Forcer l'unité du « Volume » (vide = titres, établi par la sonde)"
        type: choice
        options: ["", "titres", "fcfa"]
        default: ""
      tickers:
        description: "Valeurs à rapatrier (vide = tout le référentiel)"
        required: false
        default: ""
      pause:
        description: "Secondes entre deux requêtes"
        required: false
        default: "0.5"

# Lecture seule : l'action dépose un artefact, elle ne commite pas. Voir
# `ingestion.yml` pour le raisonnement — un runner ne sait pas signer.
permissions:
  contents: read

# Deux rapatriements simultanés se marcheraient dessus sur data/cours.csv,
# et le second effacerait ce que le premier vient d'ajouter.
concurrency:
  group: rapatriement
  cancel-in-progress: false

jobs:
  rapatrier:
    runs-on: ubuntu-latest
    # 47 valeurs × 6 ans = ~1 100 requêtes espacées de 1,5 s, soit une
    # demi-heure de réseau. La marge couvre les reprises.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip && pip install -e .

      # Un appel, et les deux questions qui ne peuvent pas être tranchées
      # hors ligne : ce que mesure « Volume », et si l'OHLC est cohérent.
      # La sonde couvre mars 2026 parce que c'est la période dont les
      # valeurs sont connues par ailleurs — le témoin a besoin du 19/03.
      - name: Sonder
        if: inputs.sonde
        run: |
          echo "::notice::Sonde sur SDSC. Rien ne sera écrit."
          python -m brvm sonder --ticker SDSC \
            --debut 2026-01-01 --fin 2026-03-31

      # Les trois sources de dividendes, dont aucune n'a jamais été
      # atteinte depuis l'environnement de développement. `continue-on-error`
      # parce qu'une source muette est un fait à rapporter, pas une raison
      # de faire échouer la sonde des cours.
      - name: Sonder les dividendes
        if: inputs.sonde
        continue-on-error: true
        run: python -m brvm sonder-dividendes --date 2026-07-24

      # L'archive s'arrête à quatre exercices (2022-2025) parce que c'est
      # ce que la page de sikafinance affiche. Quatre exercices donnent
      # trois transitions annuelles : de quoi établir que le dividende
      # persiste, pas de quoi tester si son rendement prédit les cours.
      # Cette sonde essaie les pistes vers les exercices anciens et dit
      # laquelle existe — aucune n'est vérifiée, elles sont des hypothèses.
      - name: Sonder les exercices anciens
        if: inputs.sonde
        continue-on-error: true
        run: python -m brvm sonder-historique

      # Les dividendes se collectent avec le rapatriement : deux pages, pas
      # deux mille appels. Les sociétés non appariées à un ticker ne sont
      # pas écrites, elles sont listées dans le journal.
      - name: Collecter les dividendes
        if: ${{ !inputs.sonde }}
        continue-on-error: true
        run: |
          python -m brvm importer
          python -m brvm dividendes

      - name: Rapatrier
        if: ${{ !inputs.sonde }}
        run: |
          python -m brvm rapatrier \
            --debut "${{ inputs.debut }}" --fin "${{ inputs.fin }}" \
            --pause "${{ inputs.pause }}" \
            ${{ inputs.volume != '' && format('--volume {0}', inputs.volume) || '' }} \
            ${{ inputs.tickers != '' && format('--tickers {0}', inputs.tickers) || '' }}

      # La base SQLite est un artefact dérivé ; l'archive CSV est la source
      # de vérité. On reconstruit la première depuis la seconde pour que
      # `etat` dise la même chose que le fichier versionné.
      - name: Recharger la base et rendre compte
        if: ${{ !inputs.sonde }}
        run: |
          python -m brvm importer
          python -m brvm etat

      # SANS CETTE ÉTAPE, LE NETTOYAGE NE TIENT QU'UN RAPATRIEMENT. Les 38
      # séances fantômes retirées de l'archive viennent de sikafinance :
      # un nouveau passage sur la même plage les réimporte à l'identique.
      # Le contrôle rend 1 quand il en trouve, ce qui met l'action au rouge
      # — c'est voulu. Le retrait n'est pas automatique : effacer des cours
      # sans qu'un humain ait vu ce qui est effacé est le genre
      # d'automatisme qu'on regrette.
      - name: Contrôler les séances fantômes
        if: ${{ !inputs.sonde }}
        run: python -m brvm qualite

      - name: Déposer l'archive élargie
        if: ${{ !inputs.sonde }}
        run: |
          if git diff --quiet -- data/; then
            echo "::notice::Archive inchangée — rien à déposer."
          else
            {
              echo "### Archive à verser"
              echo '```'
              git diff --stat -- data/
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # LE MÊME FILET QUE POUR L'INGESTION QUOTIDIENNE, ET IL SERT ICI
      # DAVANTAGE. L'artefact est hébergé hors de GitHub, sur un stockage
      # que tous les environnements ne peuvent pas atteindre — celui d'où
      # ce projet est développé ne le peut pas. `cours.csv` est trop gros
      # pour tenir dans un journal, mais le calendrier des dividendes fait
      # quelques centaines de lignes : l'écrire ici permet de le verser
      # depuis n'importe quelle session capable de lire ce journal.
      #
      # Le fichier ENTIER, pas l'incrément : le rapatriement réécrit la
      # table, et un diff ne dirait pas ce qui a disparu.
      - name: Écrire le calendrier dans le journal
        if: ${{ !inputs.sonde }}
        run: |
          echo "--- DÉBUT DIVIDENDES CSV ---"
          cat data/dividendes.csv
          echo "--- FIN DIVIDENDES CSV ---"
          echo "--- DÉBUT FONDAMENTAUX CSV ---"
          cat data/fondamentaux.csv
          echo "--- FIN FONDAMENTAUX CSV ---"

      - name: Publier l'artefact
        if: ${{ !inputs.sonde }}
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: data/
          retention-days: 30
