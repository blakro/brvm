name: verser les séances en attente

# CE QUE CETTE ACTION RÉPARE. `ingestion.yml` ne commite pas — un runner ne
# sait pas signer, et l'historique doit rester vérifiable. Chaque séance est
# donc déposée en artefact, et versée ensuite depuis une session. Mais les
# artefacts sont hébergés hors de GitHub, sur un stockage que certains
# environnements ne peuvent pas atteindre : depuis celui d'où ce projet est
# développé, le téléchargement échoue au CONNECT. Les séances s'empilaient
# alors sans voie de secours, et `veille.yml` finissait par le signaler.
#
# Ici, c'est le RUNNER qui télécharge les artefacts — il les atteint, lui —
# et qui réécrit les séances manquantes dans son journal, compressées et
# empreintées. N'importe quelle session capable de lire un journal d'action
# peut alors les verser, et VÉRIFIER qu'elle les a lues entières.
#
# L'artefact reste la voie normale ; ceci est le filet, comme l'incrément
# quotidien de `ingestion.yml` — à la différence près que celui-ci rattrape
# un retard de plusieurs jours d'un coup.
on:
  # 16 h 45 UTC, du lundi au vendredi : trois quarts d'heure après
  # `ingestion.yml`, de quoi laisser son artefact se publier. Le versement
  # cesse ainsi d'attendre qu'on y pense — c'était le seul maillon manuel
  # de la chaîne, et il a laissé l'archive prendre cinq séances de retard.
  schedule:
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
    inputs:
      executions:
        description: "Nombre d'exécutions d'ingestion à examiner"
        required: false
        default: "20"

# `contents: write` DÉSORMAIS, ET CE N'EST PAS UN RENONCEMENT. Le projet
# refusait qu'un runner commite parce qu'il ne sait pas signer, et qu'un
# historique à moitié vérifiable ne vaut guère mieux qu'un historique nu.
# L'objection portait sur la SIGNATURE, pas sur l'écriture : une clé propre
# au robot, déposée en secret de dépôt, la lève. Chaque versement reste
# « Verified », et l'auteur dit qui a agi — « versement automatique » et non
# un humain.
#
# Ce que la contrepartie coûte, dit franchement : une signature ne prouve
# plus qu'une personne tenait sa clé, seulement que le commit vient de ce
# dépôt-ci. La distinction reste lisible dans le journal, elle ne disparaît
# pas — mais elle change de nature, et c'est un choix, pas un détail.
#
# SANS LE SECRET, RIEN N'EST POUSSÉ. Le workflow retombe alors sur son
# ancien comportement : émettre l'incrément dans le journal, à verser à la
# main. Une clé absente ou révoquée fait perdre l'automatisme, jamais la
# donnée.
permissions:
  contents: write
  actions: read

jobs:
  verser:
    runs-on: ubuntu-latest
    # `secrets` N'EXISTE PAS DANS UN `if` D'ÉTAPE — GitHub refuse le
    # fichier entier, pas seulement l'étape, et le workflow ne démarre
    # jamais. La présence de la clé se lit donc ici, où le contexte est
    # autorisé, et voyage ensuite comme une variable ordinaire. Le booléen
    # arrive en chaîne : c'est « true » qu'on compare, pas true.
    env:
      CLE_PRESENTE: ${{ secrets.CLE_VERSEMENT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rassembler les séances absentes de l'archive
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          EXECUTIONS: ${{ inputs.executions }}
        run: |
          python - <<'PY'
          import io, json, os, urllib.error, urllib.request, zipfile

          DEPOT = os.environ["DEPOT"]
          RACINE = f"https://api.github.com/repos/{DEPOT}"
          ENTETES = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json"}


          # LE PIÈGE, RENCONTRÉ AU PREMIER PASSAGE. Télécharger un artefact
          # renvoie une redirection vers un stockage tiers, et urllib
          # réémet l'en-tête `Authorization` en la suivant : le stockage la
          # refuse — « HTTP 401 : Server failed to authenticate ». Le jeton
          # GitHub n'a de toute façon rien à faire chez un tiers ; l'URL
          # signée qu'on reçoit porte déjà son autorisation.
          class SansRedirection(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_args, **_kwargs):
                  return None


          OUVREUR = urllib.request.build_opener(SansRedirection())


          def lire(url: str, authentifie: bool = True) -> bytes:
              requete = urllib.request.Request(
                  url, headers=ENTETES if authentifie else {})
              try:
                  with OUVREUR.open(requete, timeout=120) as reponse:
                      return reponse.read()
              except urllib.error.HTTPError as erreur:
                  suite = erreur.headers.get("Location") if erreur.headers else None
                  if erreur.code in (301, 302, 303, 307, 308) and suite:
                      return lire(suite, authentifie=False)
                  raise


          # L'ARCHIVE VERSÉE FAIT FOI. Une séance déjà dans le CSV du dépôt
          # n'est pas réémise : le journal ne doit contenir que ce qui
          # manque, sinon relire devient aussi coûteux que tout retélécharger.
          #
          # La comparaison porte sur (date, ticker) — la clé primaire de la
          # table — et non sur la ligne entière : deux écritures du même
          # cours qui ne diffèrent que par la représentation d'un flottant
          # passeraient sinon pour deux séances.
          def cle(ligne: str) -> tuple[str, str]:
              date, ticker = ligne.split(",", 2)[:2]
              return date, ticker

          with open("data/cours.csv", encoding="utf-8") as f:
              entete = f.readline().rstrip("\n")
              connues = {cle(l): l for l in
                         (x.rstrip("\n") for x in f) if l.strip()}
          derniere = max((d for d, _ in connues), default="")
          # LES DATES PRÉSENTES, ET PAS SEULEMENT LA DERNIÈRE : c'est ce qui
          # sépare un TROU d'une ligne délibérément retirée. Voir plus bas.
          datees = {d for d, _ in connues}
          print(f"archive versée : {len(connues)} lignes, "
                f"dernière séance {derniere or '—'}")

          combien = int(os.environ.get("EXECUTIONS") or 20)

          # DEUX SOURCES, ET L'ORDRE COMPTE. `ingestion` apporte la séance
          # du jour ; `rapatriement` sert à reprendre une séance manquée —
          # le 6 août 2026 l'a été, l'ingestion ayant été annulée à
          # mi-course. Les deux déposent le même artefact `archive-<run>`.
          #
          # L'ingestion passe en premier parce que c'est d'elle, et d'elle
          # seule, qu'on retient le référentiel : le rapatriement lit un
          # historique par valeur et ne rafraîchit pas la liste des cotées.
          runs = []
          for atelier in ("ingestion.yml", "rapatriement.yml"):
              runs += [(atelier, r) for r in json.loads(lire(
                  f"{RACINE}/actions/workflows/{atelier}/runs"
                  f"?status=success&per_page={combien}"))["workflow_runs"]]

          nouvelles: dict[tuple[str, str], str] = {}
          for atelier, run in runs:
              arts = json.loads(lire(
                  f"{RACINE}/actions/runs/{run['id']}/artifacts"))["artifacts"]
              for art in arts:
                  if art["expired"] or not art["name"].startswith("archive-"):
                      continue
                  brut = lire(f"{RACINE}/actions/artifacts/{art['id']}/zip")
                  with zipfile.ZipFile(io.BytesIO(brut)) as z:
                      # `path: data/` dépose les fichiers à la racine du zip.
                      noms = [n for n in z.namelist()
                              if n.endswith("cours.csv")]
                      if not noms:
                          print(f"  {art['name']} : pas de cours.csv")
                          continue
                      texte = z.read(noms[0]).decode("utf-8")
                      # LE RÉFÉRENTIEL EN ENTIER, ET SEULEMENT LE PLUS
                      # RÉCENT. `derniere_vue` ne se déduit pas des cours :
                      # une société peut être cotée sans échanger. C'est
                      # une table réécrite, pas un incrément — un diff ne
                      # dirait pas ce qui en a disparu. Les exécutions
                      # arrivent de la plus récente à la plus ancienne :
                      # le premier référentiel rencontré est le bon.
                      #
                      # DE L'INGESTION SEULEMENT. Le rapatriement lit un
                      # historique valeur par valeur et ne rafraîchit pas la
                      # liste des cotées : son référentiel est celui du jour
                      # où on l'a lancé, et le retenir ferait reculer
                      # `derniere_vue` pour tout le monde.
                      refs = [n for n in z.namelist()
                              if n.endswith("referentiel.csv")]
                      if (refs and atelier == "ingestion.yml"
                              and not os.path.exists("referentiel.csv")):
                          with open("referentiel.csv", "w",
                                    encoding="utf-8") as f:
                              f.write(z.read(refs[0]).decode("utf-8"))
                          print(f"  {art['name']} : référentiel retenu "
                              f"({run['created_at'][:10]})")
                  absentes = {cle(l): l for l in texte.splitlines()[1:]
                              if l.strip() and cle(l) not in connues}
                  # DEUX FAÇONS D'ÊTRE ABSENTE, ET UNE SEULE SE VERSE.
                  #
                  # Le garde-fou d'origine ne retenait que les séances
                  # POSTÉRIEURES à l'archive, et il a servi dès le premier
                  # passage : l'artefact du 28 juillet portait encore les
                  # 38 lignes fantômes retirées le 29, et les verser les
                  # aurait ressuscitées sans que rien ne le dise — la panne
                  # exacte contre laquelle `db.effacer_cours` a été écrit.
                  #
                  # Mais il refusait du même geste toute reprise de TROU :
                  # une séance manquée est antérieure par définition. Le
                  # 6 août 2026 était donc irrattrapable par cette voie.
                  #
                  # Ce qui sépare les deux cas se lit dans l'archive
                  # elle-même. Une ligne retirée l'a été d'une date qui
                  # existe toujours — le 09/02/2015 y garde 22 lignes, le
                  # 25/12/2017 en garde 30. Un trou, lui, est une date
                  # ENTIÈREMENT absente. La règle tient en une phrase : on
                  # verse ce qui est postérieur, et ce qui comble une date
                  # dont l'archive ne sait rien. Jamais une ligne qu'elle a
                  # écartée d'une date qu'elle connaît.
                  ajout, ecartees = {}, 0
                  combles = set()
                  for (d, t), l in absentes.items():
                      if d > derniere:
                          ajout[(d, t)] = l
                      elif d not in datees:
                          ajout[(d, t)] = l
                          combles.add(d)
                      else:
                          ecartees += 1
                  dates = sorted({d for d, _ in ajout})
                  print(f"  {art['name']} ({run['created_at'][:10]}) : "
                        f"{len(ajout)} lignes neuves {dates or ''}")
                  if combles:
                      print(f"      dont {len(combles)} séance(s) comblée(s) "
                            f"dans l'archive : {', '.join(sorted(combles))}")
                  if ecartees:
                      anciennes = sorted({d for d, _ in absentes
                                          if d <= derniere and d in datees})
                      print(f"      {ecartees} lignes ÉCARTÉES : antérieures "
                            f"ET sur des séances déjà présentes, donc "
                            f"retirées à dessein — {anciennes[0]}…"
                            f"{anciennes[-1]}")
                  # LE PLUS RÉCENT GAGNE, ET `update` FAISAIT L'INVERSE.
                  # Les exécutions sont parcourues de la plus récente à la
                  # plus ancienne ; `update` écrase à chaque tour, si bien
                  # que la PLUS ANCIENNE avait le dernier mot. Tant qu'un
                  # artefact par séance suffisait, cela ne se voyait pas.
                  # Cela se voit dès qu'on reprend une séance : un
                  # rapatriement corrigé serait écrasé par celui qu'il
                  # corrige, et la mauvaise donnée gagnerait en silence.
                  for k, v in ajout.items():
                      nouvelles.setdefault(k, v)

          if not nouvelles:
              print("\nRien à verser : l'archive contient déjà tout.")
              raise SystemExit(0)

          # Trié : le CSV du dépôt l'est, et un incrément dans le désordre
          # ferait un diff illisible au versement.
          ordonne = [nouvelles[k] for k in sorted(nouvelles)]
          with open("increment.csv", "w", encoding="utf-8") as f:
              f.write(entete + "\n")
              f.write("\n".join(ordonne) + "\n")

          dates = sorted({d for d, _ in nouvelles})
          print(f"\n{len(ordonne)} lignes sur {len(dates)} séances : "
                f"{', '.join(dates)}")
          PY

      # LES MÊMES CONTRÔLES QU'À LA MAIN, PARCE QUE PERSONNE NE REGARDERA.
      # Un versement manuel passe sous les yeux de quelqu'un ; celui-ci
      # n'aura pour témoin que ce journal. Tout ce qu'une session vérifiait
      # avant d'écrire est donc vérifié ici, et un seul contrôle qui tombe
      # annule le versement — l'incrément part alors dans le journal, à
      # verser à la main, comme avant.
      #
      # Bibliothèque standard uniquement : ce job n'installe rien, et lui
      # faire installer pandas pour diviser deux nombres coûterait une
      # minute par séance et une dépendance de plus à la chaîne.
      - name: Appliquer l'incrément et le contrôler
        id: appliquer
        run: |
          python - <<'PY'
          import os, shutil


          def cle(ligne: str) -> tuple[str, str]:
              date, ticker = ligne.split(",", 2)[:2]
              return date, ticker


          def sortie(**valeurs):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  for nom, valeur in valeurs.items():
                      f.write(f"{nom}={valeur}\n")


          if not os.path.exists("increment.csv"):
              print("rien à appliquer")
              sortie(applique="false", motif="rien")
              raise SystemExit(0)

          with open("data/cours.csv", encoding="utf-8") as f:
              entete = f.readline().rstrip("\n")
              archive = [l.rstrip("\n") for l in f if l.strip()]
          with open("increment.csv", encoding="utf-8") as f:
              tete = f.readline().rstrip("\n")
              incr = [l.rstrip("\n") for l in f if l.strip()]

          refus = []
          if tete != entete:
              refus.append(f"en-têtes différents : {tete!r} vs {entete!r}")

          connues = {cle(l) for l in archive}
          deja = [l for l in incr if cle(l) in connues]
          if deja:
              refus.append(f"{len(deja)} lignes déjà présentes dans l'archive")

          # POSTÉRIEURE, OU COMBLANT UNE DATE INCONNUE. Une ligne antérieure
          # sur une séance que l'archive connaît déjà en a été retirée à
          # dessein — la ressusciter est la panne contre laquelle
          # `db.effacer_cours` a été écrit. Une date dont l'archive ne sait
          # rien est un trou, et se comble.
          derniere = max((d for d, _ in connues), default="")
          datees = {d for d, _ in connues}
          intruses = [l for l in incr
                      if cle(l)[0] <= derniere and cle(l)[0] in datees]
          if intruses:
              refus.append(f"{len(intruses)} lignes antérieures sur des "
                           f"séances déjà présentes (retirées à dessein)")
          combles = sorted({cle(l)[0] for l in incr
                            if cle(l)[0] <= derniere and cle(l)[0] not in datees})
          if combles:
              print(f"séances comblées : {', '.join(combles)}")

          # UN COURS NUL OU NÉGATIF N'EST JAMAIS LÉGITIME. Contrairement à
          # la limite de séance, celui-ci ne connaît pas d'exception : il
          # signale une lecture cassée, jamais un marché.
          absurdes = []
          derniers = {}
          for ligne in archive:
              champs = ligne.split(",")
              if champs[5]:
                  derniers[champs[1]] = float(champs[5])
          hors = []
          for ligne in sorted(incr, key=cle):
              champs = ligne.split(",")
              date, ticker, cloture = champs[0], champs[1], champs[5]
              if not cloture:
                  continue
              valeur = float(cloture)
              if valeur <= 0:
                  absurdes.append(f"{date} {ticker} {valeur}")
              veille = derniers.get(ticker)
              if veille:
                  ecart = valeur / veille - 1
                  if abs(ecart) > 0.0751:
                      hors.append(f"{date} {ticker} {ecart:+.2%}")
              derniers[ticker] = valeur
          if absurdes:
              refus.append(f"{len(absurdes)} clôtures nulles ou négatives : "
                           + ", ".join(absurdes[:5]))

          # LA SÉANCE REPUBLIÉE, ET J'EN AI VERSÉ UNE. Le 6 août 2026 a été
          # « rattrapé » par rapatriement, et les 47 lignes obtenues étaient
          # la séance du 7 au titre près : mêmes clôtures, mêmes volumes.
          # L'app a affiché 0 % partout, et c'est l'utilisateur qui l'a vu.
          #
          # `sikafinance.seances_repetees` porte déjà le critère, mesuré sur
          # ce marché : « deux échanges égaux au franc près n'existent pas,
          # c'est la même transaction republiée ». Il valait pour une valeur
          # à la fois ; à l'échelle d'une séance entière, un volume commun à
          # toutes les valeurs deux jours de suite est impossible.
          #
          # Les volumes NULS se répètent normalement — une valeur qui
          # n'échange pas deux jours de suite — et sont donc exclus du
          # décompte, comme dans le contrôle d'origine.
          derniers_volumes = {}
          for ligne in archive:
              champs = ligne.split(",")
              if champs[6]:
                  derniers_volumes[champs[1]] = (champs[6], champs[5])
          par_seance = {}
          for ligne in incr:
              champs = ligne.split(",")
              if champs[6] and float(champs[6]) > 0:
                  par_seance.setdefault(champs[0], []).append(
                      (champs[1], champs[6], champs[5]))
          for date, valeurs in sorted(par_seance.items()):
              # Sous cinq valeurs échangées, la coïncidence redevient
              # possible et le contrôle ne prouverait rien.
              if len(valeurs) < 5:
                  continue
              repetees = sum(1 for t, v, c in valeurs
                             if derniers_volumes.get(t) == (v, c))
              if repetees >= 0.9 * len(valeurs):
                  refus.append(
                      f"séance {date} : {repetees}/{len(valeurs)} valeurs au "
                      "volume ET au cours identiques à leur séance "
                      "précédente — séance republiée, pas une séance neuve")

          # LA LIMITE DE ±7,5 % EST DÉCRITE, JAMAIS OPPOSÉE, et ce n'est pas
          # de la mollesse — c'est ce que le projet a MESURÉ. Sur l'archive,
          # ce contrôle lève 356 alertes dont l'immense majorité est
          # légitime : au détachement, le prix de référence est ajusté du
          # dividende et une baisse de 9 à 13 % y est régulière ; la limite
          # relie deux séances CONSÉCUTIVES, pas deux blocs séparés d'un
          # mois ; une division du nominal la franchit par construction.
          #
          # Refuser là-dessus aurait bloqué le versement en pleine saison
          # des détachements — mai à août — c'est-à-dire maintenant. Un
          # contrôle qui crie sur des données correctes n'est pas un
          # contrôle : c'est un bruit qu'on apprend à ignorer, et le jour où
          # il a raison personne ne l'écoute. Voir `qualite.limites`, qui
          # range ces dépassements par cause probable, et `pics_isoles`,
          # qui cherche la seule signature sans ambiguïté — inapplicable
          # ici, elle demande la séance SUIVANTE.
          if hors:
              print(f"note : {len(hors)} variations franchissent ±7,5 % "
                    f"({', '.join(hors[:5])}) — décrites, pas opposées. "
                    "« brvm qualite » les range par cause probable.")

          if refus:
              print("VERSEMENT REFUSÉ :")
              for motif in refus:
                  print(f"  - {motif}")
              print("\nL'incrément part dans le journal ; à verser à la main "
                    "après examen.")
              sortie(applique="false", motif="controle")
              raise SystemExit(0)

          # LA GARANTIE N'EST PLUS « ÇA S'AJOUTE EN QUEUE » : combler un trou
          # insère au milieu. Ce qui doit rester vrai, et qui est vérifié
          # ici, c'est que la fusion est triée, qu'elle ne perd aucune ligne
          # de l'archive, et qu'elle en compte exactement autant qu'avant
          # plus l'incrément — donc qu'elle n'en invente ni n'en écrase.
          fusion = sorted(archive + incr, key=cle)
          assert fusion == sorted(fusion, key=cle), "fusion non triée"
          assert set(archive).issubset(set(fusion)), "l'archive a perdu une ligne"
          assert len(fusion) == len(archive) + len(incr), \
              f"{len(fusion)} lignes au lieu de {len(archive) + len(incr)}"
          with open("data/cours.csv", "w", encoding="utf-8") as f:
              f.write(entete + "\n" + "\n".join(fusion) + "\n")

          # Le référentiel est une table RÉÉCRITE, pas un incrément : celui
          # de l'artefact le plus récent porte déjà la fusion faite par
          # `ingestion`, donc il remplace, il ne se complète pas.
          #
          # COPIÉ ET NON DÉPLACÉ : si le versement échoue plus loin, le
          # journal doit encore trouver `referentiel.csv` à la racine pour
          # l'émettre. Le déplacer privait le filet de la moitié de ce
          # qu'il doit rattraper.
          if os.path.exists("referentiel.csv"):
              shutil.copy("referentiel.csv", "data/referentiel.csv")
              print("référentiel remplacé par le plus récent")

          dates = sorted({d for d, _ in (cle(l) for l in incr)})
          print(f"appliqué : +{len(incr)} lignes, séances {', '.join(dates)}")
          sortie(applique="true", lignes=len(incr),
                 seances=len(dates), dates=" ".join(dates))
          PY

      # LA CLÉ EST CELLE DU ROBOT, ET ELLE NE SERT QU'ICI. Elle est déposée
      # en secret de dépôt et enregistrée comme clé de SIGNATURE sur le
      # compte — pas comme clé de déploiement, qui ne signerait rien.
      # L'auteur porte un nom qui dit ce qu'il est ; l'adresse est celle,
      # vérifiée, du compte, sans quoi GitHub refuserait la signature.
      #
      # `if` sur le secret : sans lui l'étape est SAUTÉE, pas en échec, et
      # le journal reprend son rôle plus bas.
      - name: Signer et verser
        id: verser
        if: ${{ steps.appliquer.outputs.applique == 'true'
                && env.CLE_PRESENTE == 'true' }}
        env:
          CLE: ${{ secrets.CLE_VERSEMENT }}
          COURRIEL: ${{ vars.COURRIEL_VERSEMENT }}
          DATES: ${{ steps.appliquer.outputs.dates }}
          LIGNES: ${{ steps.appliquer.outputs.lignes }}
          SEANCES: ${{ steps.appliquer.outputs.seances }}
        run: |
          set -euo pipefail

          # Une adresse absente donnerait un commit sans auteur valide, que
          # GitHub refuserait de marquer « Verified » — l'automatisme
          # tournerait en produisant exactement ce qu'on voulait éviter.
          # Mieux vaut s'arrêter ici : le journal prendra le relais.
          if [ -z "${COURRIEL}" ]; then
            echo "::error::La variable de dépôt COURRIEL_VERSEMENT est vide."
            echo "Renseignez une adresse VÉRIFIÉE du compte, sans quoi la"
            echo "signature ne sera pas reconnue. Voir README."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/versement
          chmod 600 ~/.ssh/versement
          ssh-keygen -y -f ~/.ssh/versement > ~/.ssh/versement.pub

          git config user.name "versement automatique"
          git config user.email "$COURRIEL"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/versement.pub
          git config commit.gpgsign true

          # Le message passe par un fichier : l'écrire en ligne de commande
          # exposerait son contenu à l'interprétation du shell, et une
          # apostrophe ou un accent grave dans un nom de société suffirait
          # à casser le versement — ou pire, à exécuter quelque chose.
          {
            echo "Verser ${SEANCES} séance(s) : ${DATES}"
            echo
            echo "Versé par l'action, artefacts d'ingestion relus et"
            echo "contrôlés : en-têtes, doublons, antériorité, tri, et la"
            echo "limite de ±7,5 % par séance. ${LIGNES} lignes ajoutées."
            echo
            echo "Commit signé par la clé du robot — l'auteur dit qui a agi."
          } > message.txt

          git add data/cours.csv data/referentiel.csv
          git commit -F message.txt

          # LE DÉPÔT PEUT AVOIR BOUGÉ pendant que les artefacts se
          # téléchargeaient. Rejouer le versement au-dessus de `main` plutôt
          # que d'échouer : le commit est resigné au passage, la clé est là.
          for essai in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && { echo "poussé"; exit 0; }
            echo "poussée refusée, nouvel essai ($essai)"
            sleep $((essai * 5))
          done
          echo "trois tentatives refusées — reprise à la main"
          exit 1

      # COMPRESSÉ SUR UNE LIGNE, ET CE N'EST PAS DE LA COQUETTERIE. En
      # clair, quatre séances font près de deux cents lignes de journal :
      # les relire demande de deviner combien de lignes remonter, et une
      # ligne manquée passe pour une donnée absente plutôt que pour une
      # lecture tronquée. L'empreinte tranche — le versement se vérifie
      # au lieu de se supposer.
      #
      # DEVENU LE FILET, ET NON PLUS LA VOIE NORMALE. Il ne s'écrit que si
      # rien n'a été poussé : contrôle en échec, secret absent, clé
      # révoquée. La donnée reste alors récupérable à la main — c'est
      # exactement ce qui a servi à rattraper les quatre séances du 3 au
      # 7 août, quand le stockage d'artefacts était injoignable.
      - name: Écrire l'incrément dans le journal
        if: ${{ always() && steps.verser.outcome != 'success' }}
        run: |
          if [ ! -s increment.csv ]; then
            echo "rien à écrire"
            exit 0
          fi
          echo "Aucun versement automatique : reprise à la main depuis ce"
          echo "journal. Voir README, « Verser une séance à la main »."
          for f in increment referentiel; do
            [ -s "$f.csv" ] || continue
            echo "--- $f sha256 $(sha256sum "$f.csv" | cut -c1-16) \
          lignes $(wc -l < "$f.csv") ---"
            echo "--- $f base64 gzip ---"
            gzip -9 -c "$f.csv" | base64 -w0
            echo
          done
