name: verser les séances en attente

# CE QUE CETTE ACTION RÉPARE. `ingestion.yml` ne commite pas — un runner ne
# sait pas signer, et l'historique doit rester vérifiable. Chaque séance est
# donc déposée en artefact, et versée ensuite depuis une session. Mais les
# artefacts sont hébergés hors de GitHub, sur un stockage que certains
# environnements ne peuvent pas atteindre : depuis celui d'où ce projet est
# développé, le téléchargement échoue au CONNECT. Les séances s'empilaient
# alors sans voie de secours, et `veille.yml` finissait par le signaler.
#
# Ici, c'est le RUNNER qui télécharge les artefacts — il les atteint, lui —
# et qui réécrit les séances manquantes dans son journal, compressées et
# empreintées. N'importe quelle session capable de lire un journal d'action
# peut alors les verser, et VÉRIFIER qu'elle les a lues entières.
#
# L'artefact reste la voie normale ; ceci est le filet, comme l'incrément
# quotidien de `ingestion.yml` — à la différence près que celui-ci rattrape
# un retard de plusieurs jours d'un coup.
on:
  workflow_dispatch:
    inputs:
      executions:
        description: "Nombre d'exécutions d'ingestion à examiner"
        required: false
        default: "20"

# `actions: read` en plus : lister les exécutions et télécharger leurs
# artefacts. Toujours aucune écriture — c'est la session qui versera.
permissions:
  contents: read
  actions: read

jobs:
  verser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rassembler les séances absentes de l'archive
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          EXECUTIONS: ${{ inputs.executions }}
        run: |
          python - <<'PY'
          import io, json, os, urllib.request, zipfile

          DEPOT = os.environ["DEPOT"]
          RACINE = f"https://api.github.com/repos/{DEPOT}"
          ENTETES = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json"}


          def lire(url: str) -> bytes:
              requete = urllib.request.Request(url, headers=ENTETES)
              with urllib.request.urlopen(requete, timeout=120) as reponse:
                  return reponse.read()


          # L'ARCHIVE VERSÉE FAIT FOI. Une séance déjà dans le CSV du dépôt
          # n'est pas réémise : le journal ne doit contenir que ce qui
          # manque, sinon relire devient aussi coûteux que tout retélécharger.
          #
          # La comparaison porte sur (date, ticker) — la clé primaire de la
          # table — et non sur la ligne entière : deux écritures du même
          # cours qui ne diffèrent que par la représentation d'un flottant
          # passeraient sinon pour deux séances.
          def cle(ligne: str) -> tuple[str, str]:
              date, ticker = ligne.split(",", 2)[:2]
              return date, ticker

          with open("data/cours.csv", encoding="utf-8") as f:
              entete = f.readline().rstrip("\n")
              connues = {cle(l): l for l in
                         (x.rstrip("\n") for x in f) if l.strip()}
          print(f"archive versée : {len(connues)} lignes, dernière séance "
                f"{max((d for d, _ in connues), default='—')}")

          combien = int(os.environ.get("EXECUTIONS") or 20)
          runs = json.loads(lire(
              f"{RACINE}/actions/workflows/ingestion.yml/runs"
              f"?status=success&per_page={combien}"))["workflow_runs"]

          nouvelles: dict[tuple[str, str], str] = {}
          for run in runs:
              arts = json.loads(lire(
                  f"{RACINE}/actions/runs/{run['id']}/artifacts"))["artifacts"]
              for art in arts:
                  if art["expired"] or not art["name"].startswith("archive-"):
                      continue
                  brut = lire(f"{RACINE}/actions/artifacts/{art['id']}/zip")
                  with zipfile.ZipFile(io.BytesIO(brut)) as z:
                      # `path: data/` dépose les fichiers à la racine du zip.
                      noms = [n for n in z.namelist()
                              if n.endswith("cours.csv")]
                      if not noms:
                          print(f"  {art['name']} : pas de cours.csv")
                          continue
                      texte = z.read(noms[0]).decode("utf-8")
                  ajout = {cle(l): l for l in texte.splitlines()[1:]
                           if l.strip() and cle(l) not in connues}
                  dates = sorted({d for d, _ in ajout})
                  print(f"  {art['name']} ({run['created_at'][:10]}) : "
                        f"{len(ajout)} lignes neuves {dates or ''}")
                  nouvelles.update(ajout)

          if not nouvelles:
              print("\nRien à verser : l'archive contient déjà tout.")
              raise SystemExit(0)

          # Trié : le CSV du dépôt l'est, et un incrément dans le désordre
          # ferait un diff illisible au versement.
          ordonne = [nouvelles[k] for k in sorted(nouvelles)]
          with open("increment.csv", "w", encoding="utf-8") as f:
              f.write(entete + "\n")
              f.write("\n".join(ordonne) + "\n")

          dates = sorted({d for d, _ in nouvelles})
          print(f"\n{len(ordonne)} lignes sur {len(dates)} séances : "
                f"{', '.join(dates)}")
          PY

      # COMPRESSÉ SUR UNE LIGNE, ET CE N'EST PAS DE LA COQUETTERIE. En
      # clair, quatre séances font près de deux cents lignes de journal :
      # les relire demande de deviner combien de lignes remonter, et une
      # ligne manquée passe pour une donnée absente plutôt que pour une
      # lecture tronquée. L'empreinte tranche — le versement se vérifie
      # au lieu de se supposer.
      - name: Écrire l'incrément dans le journal
        run: |
          if [ ! -s increment.csv ]; then
            echo "rien à écrire"
            exit 0
          fi
          echo "--- increment sha256 $(sha256sum increment.csv | cut -c1-16) \
          lignes $(wc -l < increment.csv) ---"
          echo "--- increment base64 gzip ---"
          gzip -9 -c increment.csv | base64 -w0
          echo
