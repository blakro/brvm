name: ingestion quotidienne

on:
  schedule:
    # 16 h 00 UTC, du lundi au vendredi. La séance de la BRVM ferme vers
    # 15 h heure d'Abidjan, qui est UTC : une heure de marge avant que le
    # site publie sa clôture définitive. Avant elle, `ingerer` refuse
    # d'écrire — la colonne « Cours Clôture » porte alors le dernier cours
    # traité, pas la clôture.
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

# LECTURE SEULE, ET C'EST LE POINT. Un runner GitHub n'a pas de clé de
# signature : tout commit qu'il produirait resterait non signé, et
# l'historique du dépôt cesserait d'être intégralement vérifiable pour la
# commodité d'un cron. L'action produit donc un ARTEFACT ; le commit se
# fait depuis une session qui sait signer.
#
# Le prix est réel : l'archive n'avance plus toute seule. C'est
# exactement ce que `veille.yml` surveille — elle ouvre une issue quand la
# donnée cesse de progresser, et devient ici le rappel qu'un artefact
# attend d'être versé.
permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip && pip install -e .

      # La base SQLite n'est pas versionnée : le runner est éphémère, il
      # reconstruit l'historique depuis les CSV avant d'y ajouter le jour.
      - name: Reconstruire la base depuis l'archive
        run: python -m brvm importer

      # `continue-on-error` parce qu'un refus est un cas normal : jour
      # férié, séance non close, site en maintenance. Marquer l'exécution
      # en rouge chaque jour chômé apprendrait vite à ignorer les alertes,
      # et l'alerte qui compte passerait avec les autres. Ce qui est
      # anormal — plusieurs jours sans nouvelle ligne — se voit dans
      # l'historique du CSV.
      - name: Ingérer la séance
        id: ingestion
        continue-on-error: true
        run: python -m brvm ingerer

      - name: Rafraîchir le référentiel
        continue-on-error: true
        run: python -m brvm referentiel

      - name: Réécrire l'archive
        run: python -m brvm exporter

      - name: Y a-t-il quelque chose de neuf ?
        id: neuf
        run: |
          if git diff --quiet -- data/; then
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle donnée." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=oui" >> "$GITHUB_OUTPUT"
            {
              echo "### Séance à verser"
              echo '```'
              git diff --stat -- data/
              echo '```'
              echo "Archive déposée en artefact : elle sera versée au dépôt"
              echo "depuis une session, avec signature."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Déposer l'archive
        if: steps.neuf.outputs.present == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: data/
          # Assez pour qu'une absence d'une quinzaine de jours ne fasse
          # rien perdre ; au-delà, `veille` aura alerté depuis longtemps.
          retention-days: 30

      - name: Résumé
        if: always()
        run: |
          {
            echo "### État de la base"
            echo '```'
            python -m brvm etat || true
            echo '```'
            echo "ingestion : ${{ steps.ingestion.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
