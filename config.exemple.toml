# Copiez ce fichier en `config.toml` pour modifier un réglage.
# Tout est facultatif : chaque clé absente reprend le défaut de
# src/brvm/config.py, et un config.toml absent est un cas normal.

[ingestion]
# Identifiez-vous : si le scraping gêne brvm.org, autant qu'ils sachent
# qui appeler plutôt que de bloquer une plage d'adresses.
user_agent = "brvm-conseil/0.1 (+https://github.com/blakro/brvm)"

# Politesse entre deux requêtes, en secondes.
delai_entre_requetes_s = 1.5

# Avant cette heure, `ingerer` refuse d'écrire une séance du jour : la
# colonne « Cours Clôture » de brvm.org porte alors le dernier cours
# traité, pas la clôture. Enregistrer ce provisoire le figerait dans une
# série que rien ne viendrait corriger.
heure_cloture_seance = "15:00"

[base]
# Relatif à la racine du dépôt, ou absolu.
chemin = "data/brvm.db"

[exogenes]
# Variation mesurée sur ~3 mois, décalée de ~2 mois : une hausse du
# caoutchouc n'atteint pas le cours de la SAPH le lendemain, elle passe
# d'abord dans les marges puis dans des résultats trimestriels.
fenetre_variation = 60
retard = 40

# Série → secteur qu'elle concerne. Les noms sont libres : ce sont ceux
# employés dans le CSV chargé par « brvm importer-exogenes ».
[exogenes.correspondance]
caoutchouc_tsr20 = "Consommation de Base"
huile_palme_cpo  = "Consommation de Base"
sucre            = "Consommation de Base"
eur_usd          = "Consommation de Base"
taux_bceao       = "Services Financiers"

[prediction]
# Horizon en séances (~3 mois). Pas journalier : la BRVM cote par fixing
# avec une limite de ±7,5 %, et un modèle entraîné sur le lendemain apprend
# « demain ≈ aujourd'hui ».
horizon = 60
decoupes = 4
lignes_minimum = 400
